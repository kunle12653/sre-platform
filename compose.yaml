services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sre_platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sre_platform"]
      interval: 5s
      timeout: 3s
      retries: 5
  app:
    build: .
    image: sre-platform:0.2.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: compose
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/sre_platform
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: